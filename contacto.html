<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
    	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    	<title>PixelNorte - Contacto</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>

    	<header id="site-header">
        	<h1>PixelNorte</h1>
        	<nav id="nav-principal">
            	    <ul>
                	<li><a href="index.html">Inicio</a></li>
                	<li><a href="servicios.html">Servicios</a></li>
                	<li><a href="contacto.html">Contacto</a></li>
            	    </ul> 
	</header>
	 <main>
	  <section id="contacto">
		<h2>Contacto</h2>
		<p>Escribinos,Contanos de qué se trata tu idea o proyecto</p>

			<form id="formulario-contacto" action="#" method="post">
		<div>
			<label for="nombre">Nombre completo:</label>
			<input type="text" id="nombre" name="nombre" required>
		</div>

		<div>
			<label for="email">Correo electrónico:</label>
			<input type="type" id="email" name="email" required>
		</div>

		<div>
			<label for="telefono">Teléfono de contacto:</label>
			<input type="tel" id="telefono" name="telefono">
		</div>
		<br>
		<div>
			<label for="servicio-interes">Servicio de interés:</label>
			<select id="servicio-interes">name=servicio-interes">
			   <option value="1pagina">Sitio Web de 1 pagina:</option>
			   <option value="corporativo">Sitio Web Corporativo</option>
			   <option value="ecommerce">Tienda Online(E-commerce)</option>
			   <option value="mantenimiento">Mantenimiento Mensual</option>
			</select>
		</div>
		<br>
		<div>
			<p>¿Como Preferís que te contactemos?</p>
			<input type="checkbox" id="medio-email" name"preferencia-contacto" value="email">
			<label for="medio-email">Por Email</label>
			
			<input type="checkbox" id="medio-whatsapp" name="preferencia-contacto" value="whatsapp">
			<label for="medio-whatsaap">Por Whatsapp</label>
		</div>
		<br>
		<div class="campo-ancho">
			<label for="mensaje">Dejanos tu mensaje:</label>
			<textarea id="mensaje" name="mensaje"rows="5" cols="30" required></textarea>
		</div>
		<br>
		<div class="campo-ancho">
			<button type="submit">Enviar consulta</button>
                </div>
	     </form>
	   </section>
	</main>	

 	<footer id="site-footer">
            <p>2026 PixelNorte</p>
        <footer</>
   </body>
</html>
